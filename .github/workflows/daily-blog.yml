name: Daily Blog Post

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate today's post
        id: gen
        run: |
          node .github/daily-blog.mjs | tee -a "$GITHUB_ENV"

      - name: Commit and push
        if: env.CHANGED == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "amzloss-bot"
          git config user.email "admin@amzloss.com"
          git add blogs js/blog.js sitemap.xml .github/blog-state.json
          git commit -m "Daily blog post: $(date -u +'%Y-%m-%d')"
          git push